<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Theme color now matches the locked mobile palette (Pewil green).
         viewport-fit=cover lets safe-area-inset-* land correctly on
         notched iPhones so our bottom-nav padding works. -->
    <meta name="theme-color" content="#1a6b3a"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <meta name="apple-mobile-web-app-title" content="Pewil"/>
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta
      name="description"
      content="The point-of-sale system for African shops. POS, stock, tax-compliant exports, works offline. Mobile money + card. 14-day free trial, no card."
    />
    <!-- OpenGraph + Twitter cards — used when someone shares pewil.org
         on WhatsApp, Twitter, Facebook. og-share.png is the proper
         1200x630 share card showing a POS lane with the Pewil wordmark;
         the source design lives at /og-share.html. -->
    <meta property="og:title" content="Pewil — Run your shop from your pocket" />
    <meta property="og:description" content="POS, stock, tax-compliant exports, works offline. Built for African shops. 14-day free trial, no card." />
    <meta property="og:image" content="%PUBLIC_URL%/og-share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Pewil POS — phone-first retail management for African shops" />
    <meta property="og:url" content="https://pewil.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pewil" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pewil — Run your shop from your pocket" />
    <meta name="twitter:description" content="POS, stock, tax-compliant exports, works offline. Built for African shops." />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-share.png" />
    <meta name="twitter:image:alt" content="Pewil POS — phone-first retail management for African shops" />
    <!-- Apple touch icons: spec recommends multiple sizes so iOS picks
         the right one for home-screen, splash, and app switcher. We
         only have 192/512 PNGs in /public, but iOS will pick the
         closest match for each size from these. -->
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%PUBLIC_URL%/logo512.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Playfair+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Pewil — Run your shop from your pocket | POS for African retail</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      (function () {
        setTimeout(function () {
          var rootEl = document.getElementById('root');
          if (rootEl && rootEl.children.length === 0) {
            rootEl.innerHTML =
              '<div style="max-width:480px;margin:80px auto;padding:32px;' +
              'font-family:sans-serif;text-align:center;color:#111827;">' +
              '<div style="font-size:36px;margin-bottom:12px;">!</div>' +
              '<h1 style="font-size:20px;margin:0 0 10px;">Your browser is out of date</h1>' +
              '<p style="font-size:14px;color:#555555;line-height:1.6;">' +
              'Pewil needs a newer browser to run properly. Please update Chrome ' +
              'from the Play Store, or try opening this page on a different device.' +
              '</p>' +
              '</div>';
          }
        }, 10000);
      })();
    </script>
  </body>
</html>
