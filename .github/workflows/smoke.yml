name: POS smoke test

# Runs the critical-path smoke test (login -> app loads -> POS renders) against
# a deployed environment. Point it at STAGING so a red run blocks a bad promote
# to production. Set these repo secrets: PEWIL_BASE_URL, PEWIL_TEST_EMAIL,
# PEWIL_TEST_PASSWORD (a 2FA-disabled sandbox account).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Playwright is intentionally NOT a package.json dependency (keeps the
      # Vercel production build untouched). Install it just for the test job.
      - run: npm install --no-save @playwright/test@1.49.0
      - run: npx playwright install --with-deps chromium
      - name: Run smoke test
        env:
          PEWIL_BASE_URL: ${{ secrets.PEWIL_BASE_URL }}
          PEWIL_TEST_EMAIL: ${{ secrets.PEWIL_TEST_EMAIL }}
          PEWIL_TEST_PASSWORD: ${{ secrets.PEWIL_TEST_PASSWORD }}
        run: npx playwright test tests/smoke.spec.js
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
